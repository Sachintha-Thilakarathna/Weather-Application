name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  validate:
    name: Validate client and server
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run server tests
        run: npm test -- --runInBand --prefix server

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy app
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "No deployment target configured. Add DEPLOY_URL in GitHub Secrets to enable production deployment."
            exit 0
          fi

          echo "Deploying to $DEPLOY_URL"
          echo "Replace this step with your real deployment command, for example: Vercel, Railway, Docker, SSH, or a custom script."
